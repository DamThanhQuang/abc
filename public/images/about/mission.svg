<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#dce6f5"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Sky / factory background -->
  <rect width="800" height="360" fill="url(#sky)"/>

  <!-- Factory building -->
  <rect x="100" y="160" width="600" height="280" rx="4" fill="#475569"/>
  <rect x="108" y="168" width="584" height="272" rx="3" fill="#334155"/>

  <!-- Factory windows row 1 -->
  <g fill="#7dd3fc" opacity="0.6">
    <rect x="130" y="200" width="80" height="60" rx="3"/>
    <rect x="230" y="200" width="80" height="60" rx="3"/>
    <rect x="330" y="200" width="80" height="60" rx="3"/>
    <rect x="430" y="200" width="80" height="60" rx="3"/>
    <rect x="530" y="200" width="80" height="60" rx="3"/>
    <rect x="630" y="200" width="80" height="60" rx="3"/>
  </g>

  <!-- Windows row 2 -->
  <g fill="#7dd3fc" opacity="0.4">
    <rect x="130" y="280" width="80" height="60" rx="3"/>
    <rect x="230" y="280" width="80" height="60" rx="3"/>
    <rect x="330" y="280" width="80" height="60" rx="3"/>
    <rect x="430" y="280" width="80" height="60" rx="3"/>
    <rect x="530" y="280" width="80" height="60" rx="3"/>
    <rect x="630" y="280" width="80" height="60" rx="3"/>
  </g>

  <!-- Main entrance -->
  <rect x="340" y="360" width="120" height="80" rx="3" fill="#1e293b"/>
  <rect x="340" y="360" width="60" height="80" rx="3" fill="#0f172a"/>
  <!-- Entrance sign -->
  <rect x="348" y="370" width="104" height="24" rx="3" fill="#0f4c81" opacity="0.9"/>
  <text x="400" y="386" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10" font-weight="bold">FUELPRECISION</text>

  <!-- Chimneys/pipes on roof -->
  <rect x="200" y="100" width="24" height="64" rx="4" fill="#475569"/>
  <rect x="240" y="120" width="18" height="44" rx="4" fill="#64748b"/>
  <ellipse cx="212" cy="100" rx="16" ry="6" fill="#334155"/>
  <!-- Smoke -->
  <g fill="#b0c4d8" opacity="0.3">
    <ellipse cx="212" cy="84" rx="12" ry="10"/>
    <ellipse cx="208" cy="66" rx="16" ry="13"/>
    <ellipse cx="215" cy="48" rx="10" ry="8"/>
  </g>

  <!-- Pipeline on ground (exterior) -->
  <rect x="0" y="420" width="100" height="18" rx="4" fill="#64748b"/>
  <rect x="700" y="420" width="100" height="18" rx="4" fill="#64748b"/>
  <!-- Pipeline joints -->
  <circle cx="100" cy="429" r="12" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="700" cy="429" r="12" fill="#475569" stroke="#94a3b8" stroke-width="2"/>

  <!-- Ground -->
  <rect y="440" width="800" height="160" fill="url(#floor)"/>
  <!-- Road markings -->
  <g fill="#94a3b8" opacity="0.4">
    <rect x="0" y="490" width="800" height="6" rx="3"/>
  </g>
  <g fill="white" opacity="0.6">
    <rect x="100" y="492" width="60" height="2" rx="1"/>
    <rect x="220" y="492" width="60" height="2" rx="1"/>
    <rect x="340" y="492" width="60" height="2" rx="1"/>
    <rect x="460" y="492" width="60" height="2" rx="1"/>
    <rect x="580" y="492" width="60" height="2" rx="1"/>
  </g>

  <!-- Team silhouettes (foreground) -->
  <g fill="#1e293b" opacity="0.85">
    <!-- Person 1 -->
    <circle cx="250" cy="468" r="16"/>
    <rect x="234" y="484" width="32" height="56" rx="6"/>
    <!-- Person 2 (slightly taller) -->
    <circle cx="310" cy="462" r="18"/>
    <rect x="292" y="480" width="36" height="60" rx="6"/>
    <!-- Person 3 (helmet - engineer) -->
    <circle cx="380" cy="464" r="16"/>
    <path d="M 364 458 Q 380 445 396 458" fill="#f59e0b" opacity="0.9"/>
    <rect x="364" y="480" width="32" height="58" rx="6"/>
    <!-- Person 4 -->
    <circle cx="450" cy="466" r="16"/>
    <rect x="434" y="482" width="32" height="56" rx="6"/>
    <!-- Person 5 (engineer helmet) -->
    <circle cx="520" cy="460" r="18"/>
    <path d="M 502 454 Q 520 440 538 454" fill="#f59e0b" opacity="0.9"/>
    <rect x="502" y="478" width="36" height="62" rx="6"/>
  </g>

  <!-- Company name overlay -->
  <rect x="50" y="30" width="260" height="60" rx="8" fill="#0f4c81" opacity="0.92"/>
  <text x="180" y="53" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">FUELPRECISION INDUSTRIAL</text>
  <text x="180" y="74" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13">Since 2003 · 380 Engineers</text>
</svg>
