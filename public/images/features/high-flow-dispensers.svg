<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2840"/>
      <stop offset="60%" stop-color="#0f3d6b"/>
      <stop offset="100%" stop-color="#1a5fa8"/>
    </linearGradient>
    <linearGradient id="dispenser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="764" height="280" fill="url(#bg)"/>

  <!-- Background grid -->
  <g stroke="#1a4a7a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="56" x2="764" y2="56"/> <line x1="0" y1="112" x2="764" y2="112"/>
    <line x1="0" y1="168" x2="764" y2="168"/> <line x1="0" y1="224" x2="764" y2="224"/>
    <line x1="76" y1="0" x2="76" y2="280"/> <line x1="152" y1="0" x2="152" y2="280"/>
    <line x1="228" y1="0" x2="228" y2="280"/> <line x1="305" y1="0" x2="305" y2="280"/>
    <line x1="382" y1="0" x2="382" y2="280"/> <line x1="458" y1="0" x2="458" y2="280"/>
    <line x1="534" y1="0" x2="534" y2="280"/> <line x1="610" y1="0" x2="610" y2="280"/>
    <line x1="686" y1="0" x2="686" y2="280"/>
  </g>

  <!-- Dispenser unit 1 -->
  <rect x="420" y="40" width="80" height="200" rx="6" fill="url(#dispenser)"/>
  <rect x="430" y="50" width="60" height="80" rx="4" fill="#051122"/>
  <!-- Screen on dispenser -->
  <rect x="434" y="54" width="52" height="30" rx="3" fill="#0d1f12"/>
  <text x="460" y="73" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">500L</text>
  <!-- Nozzle hook -->
  <rect x="494" y="120" width="20" height="6" rx="2" fill="#64748b"/>
  <path d="M 514 123 Q 530 123 530 140 L 530 160" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Hose -->
  <path d="M 530 160 Q 540 200 520 220" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Dispenser unit 2 -->
  <rect x="530" y="60" width="80" height="180" rx="6" fill="#283549"/>
  <rect x="540" y="70" width="60" height="60" rx="4" fill="#051122"/>
  <text x="570" y="104" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">READY</text>

  <!-- Dispenser unit 3 (partial) -->
  <rect x="640" y="50" width="80" height="190" rx="6" fill="url(#dispenser)" opacity="0.8"/>
  <rect x="650" y="60" width="60" height="60" rx="4" fill="#051122"/>
  <text x="680" y="94" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">ACTIVE</text>

  <!-- Ground line -->
  <rect x="0" y="240" width="764" height="40" fill="#061218" opacity="0.7"/>
  <g fill="#334155">
    <rect x="420" y="238" width="80" height="4"/>
    <rect x="530" y="238" width="80" height="4"/>
    <rect x="640" y="238" width="80" height="4"/>
  </g>

  <!-- Floating measurement badge -->
  <rect x="40" y="60" width="180" height="56" rx="8" fill="#061929" stroke="#1a6bb5" stroke-width="1.5" opacity="0.95"/>
  <text x="130" y="82" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10" opacity="0.8">HIGH-FLOW SYSTEM</text>
  <text x="130" y="104" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="20" font-weight="bold">500+ L/min</text>

  <!-- Status lights -->
  <circle cx="50" cy="160" r="8" fill="#22c55e" opacity="0.8"/>
  <text x="66" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11">All systems nominal</text>
  <circle cx="50" cy="185" r="8" fill="#3b82f6" opacity="0.8"/>
  <text x="66" y="189" fill="#94a3b8" font-family="sans-serif" font-size="11">IoT connected</text>
</svg>
