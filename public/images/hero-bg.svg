<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001d36"/>
      <stop offset="60%" stop-color="#0a2d4e"/>
      <stop offset="100%" stop-color="#0f4c81"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a6bb5"/>
      <stop offset="100%" stop-color="#0a3d6b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="600" fill="url(#bg)"/>

  <!-- Grid lines (blueprint effect) -->
  <g stroke="#1a4a7a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="420" x2="1280" y2="420"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="128" y1="0" x2="128" y2="600"/>
    <line x1="256" y1="0" x2="256" y2="600"/>
    <line x1="384" y1="0" x2="384" y2="600"/>
    <line x1="512" y1="0" x2="512" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="768" y1="0" x2="768" y2="600"/>
    <line x1="896" y1="0" x2="896" y2="600"/>
    <line x1="1024" y1="0" x2="1024" y2="600"/>
    <line x1="1152" y1="0" x2="1152" y2="600"/>
  </g>

  <!-- Main horizontal pipe -->
  <rect x="650" y="268" width="580" height="64" rx="6" fill="url(#pipe)" opacity="0.9"/>
  <rect x="650" y="280" width="580" height="8" rx="2" fill="#4a9fd4" opacity="0.5"/>
  <rect x="650" y="324" width="580" height="4" rx="2" fill="#0a2d4e" opacity="0.5"/>

  <!-- Vertical pipe right -->
  <rect x="1148" y="100" width="64" height="230" rx="6" fill="url(#pipe)" opacity="0.85"/>
  <rect x="1160" y="100" width="8" height="230" rx="2" fill="#4a9fd4" opacity="0.4"/>

  <!-- Vertical pipe mid -->
  <rect x="850" y="332" width="64" height="220" rx="6" fill="url(#pipe)" opacity="0.8"/>
  <rect x="862" y="332" width="8" height="220" rx="2" fill="#4a9fd4" opacity="0.4"/>

  <!-- Large circular gauge -->
  <circle cx="900" cy="220" r="90" fill="none" stroke="#1a6bb5" stroke-width="3" opacity="0.7"/>
  <circle cx="900" cy="220" r="75" fill="none" stroke="#0f4c81" stroke-width="1.5" opacity="0.5"/>
  <circle cx="900" cy="220" r="60" fill="#0a2840" opacity="0.8"/>
  <!-- Gauge ticks -->
  <g stroke="#4a9fd4" stroke-width="2" opacity="0.8">
    <line x1="900" y1="135" x2="900" y2="148"/>
    <line x1="900" y1="292" x2="900" y2="305"/>
    <line x1="815" y1="220" x2="828" y2="220"/>
    <line x1="972" y1="220" x2="985" y2="220"/>
    <line x1="839" y1="159" x2="849" y2="169"/>
    <line x1="951" y1="271" x2="961" y2="281"/>
    <line x1="951" y1="159" x2="941" y2="169"/>
    <line x1="839" y1="271" x2="849" y2="261"/>
  </g>
  <!-- Needle -->
  <line x1="900" y1="220" x2="940" y2="170" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="900" cy="220" r="8" fill="#1a6bb5"/>

  <!-- Smaller gauge right -->
  <circle cx="1100" cy="180" r="55" fill="none" stroke="#1a6bb5" stroke-width="2" opacity="0.6"/>
  <circle cx="1100" cy="180" r="42" fill="#0a2840" opacity="0.7"/>
  <line x1="1100" y1="180" x2="1128" y2="155" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="1100" cy="180" r="6" fill="#1a6bb5"/>

  <!-- Flow arrows -->
  <g fill="#4a9fd4" opacity="0.6">
    <polygon points="720,290 740,300 720,310"/>
    <polygon points="780,290 800,300 780,310"/>
    <polygon points="840,290 860,300 840,310"/>
  </g>

  <!-- Valve symbol left of main pipe -->
  <circle cx="670" cy="300" r="22" fill="#0a3d6b" stroke="#1a6bb5" stroke-width="2"/>
  <line x1="655" y1="285" x2="685" y2="315" stroke="#4a9fd4" stroke-width="2.5"/>
  <line x1="685" y1="285" x2="655" y2="315" stroke="#4a9fd4" stroke-width="2.5"/>

  <!-- Data readout display -->
  <rect x="660" y="380" width="160" height="80" rx="6" fill="#061929" stroke="#1a6bb5" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="408" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" opacity="0.7">FLOW RATE</text>
  <text x="740" y="435" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="22" font-weight="bold">500 L/m</text>
  <text x="740" y="452" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10" opacity="0.6">NOMINAL</text>

  <!-- Decorative rings top-right -->
  <circle cx="1200" cy="80" r="40" fill="none" stroke="#1a6bb5" stroke-width="1" opacity="0.3"/>
  <circle cx="1200" cy="80" r="28" fill="none" stroke="#1a6bb5" stroke-width="1" opacity="0.4"/>

  <!-- Small tech circles bottom right -->
  <circle cx="1050" cy="480" r="30" fill="none" stroke="#1a6bb5" stroke-width="1.5" opacity="0.4"/>
  <circle cx="1050" cy="480" r="18" fill="#061929" stroke="#1a6bb5" stroke-width="1" opacity="0.6"/>
  <text x="1050" y="485" text-anchor="middle" fill="#4a9fd4" font-family="monospace" font-size="9">99.9%</text>
</svg>
