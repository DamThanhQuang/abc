<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#dde4ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Main meter body -->
  <rect x="200" y="160" width="400" height="280" rx="16" fill="#1e293b"/>
  <rect x="214" y="174" width="372" height="252" rx="10" fill="#0f172a"/>

  <!-- LCD Display -->
  <rect x="240" y="196" width="320" height="140" rx="8" fill="#0d1f12"/>
  <rect x="248" y="204" width="304" height="124" rx="6" fill="#051a08"/>

  <!-- Digital readout -->
  <text x="400" y="248" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" opacity="0.6">FLOW RATE</text>
  <text x="400" y="295" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="36" font-weight="bold">247.3</text>
  <text x="400" y="320" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="14">L / min</text>

  <!-- Status lights -->
  <circle cx="252" cy="356" r="7" fill="#22c55e" opacity="0.9"/>
  <text x="268" y="360" fill="#94a3b8" font-family="sans-serif" font-size="11">NORMAL</text>
  <circle cx="340" cy="356" r="7" fill="#f59e0b" opacity="0.7"/>
  <text x="356" y="360" fill="#94a3b8" font-family="sans-serif" font-size="11">WARN</text>

  <!-- Buttons -->
  <rect x="460" y="344" width="44" height="24" rx="5" fill="#334155"/>
  <text x="482" y="360" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">SET</text>
  <rect x="516" y="344" width="44" height="24" rx="5" fill="#334155"/>
  <text x="538" y="360" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">RST</text>

  <!-- Top pipe connections -->
  <rect x="320" y="96" width="60" height="70" rx="5" fill="#475569"/>
  <rect x="316" y="92" width="68" height="12" rx="4" fill="#334155"/>
  <rect x="316" y="148" width="68" height="12" rx="4" fill="#334155"/>

  <!-- Bottom pipe connections -->
  <rect x="420" y="434" width="60" height="70" rx="5" fill="#475569"/>
  <rect x="416" y="430" width="68" height="12" rx="4" fill="#334155"/>
  <rect x="416" y="486" width="68" height="12" rx="4" fill="#334155"/>

  <!-- Connection cable -->
  <path d="M 600 300 Q 660 300 680 260 L 700 260" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="700" cy="260" r="8" fill="#f59e0b" opacity="0.8"/>

  <!-- Label -->
  <rect x="50" y="30" width="200" height="56" rx="6" fill="#0f4c81" opacity="0.9"/>
  <text x="150" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">FuelPrecision</text>
  <text x="150" y="72" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="bold">FM-Digital-Pro</text>

  <!-- Accuracy badge -->
  <rect x="550" y="490" width="200" height="56" rx="6" fill="#f0f4f8" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="514" text-anchor="middle" fill="#0f4c81" font-family="sans-serif" font-size="10">Độ chính xác</text>
  <text x="650" y="534" text-anchor="middle" fill="#0a3d6b" font-family="sans-serif" font-size="20" font-weight="bold">± 0.5%</text>
</svg>
