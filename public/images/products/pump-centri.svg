<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#dde4ee"/>
    </linearGradient>
    <linearGradient id="spiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5fa8"/>
      <stop offset="100%" stop-color="#0a3d6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Pump casing (spiral volute) -->
  <path d="M 400 150 C 560 150 640 230 640 300 C 640 410 560 470 440 490 C 320 510 220 460 190 380 C 160 300 200 200 260 170 C 300 150 340 148 400 150 Z" fill="url(#spiral)"/>

  <!-- Spiral flow path highlight -->
  <path d="M 400 170 C 540 170 615 245 615 300 C 615 395 545 448 440 465 C 338 483 248 438 222 368 C 196 298 230 213 282 185 C 316 167 358 167 400 170 Z" fill="none" stroke="#4a9fd4" stroke-width="2" opacity="0.5"/>
  <path d="M 400 200 C 510 200 580 265 580 300 C 580 375 520 420 440 434 C 362 448 296 412 274 358 C 252 304 276 242 320 220 C 348 204 372 199 400 200 Z" fill="none" stroke="#4a9fd4" stroke-width="1.5" opacity="0.35"/>

  <!-- Center impeller -->
  <circle cx="400" cy="300" r="85" fill="#1e3a5f"/>
  <!-- Impeller vanes (centrifugal) -->
  <g fill="none" stroke="#7dd3fc" stroke-width="4" opacity="0.7">
    <path d="M 400 215 Q 430 240 460 300"/>
    <path d="M 468 236 Q 466 270 440 310"/>
    <path d="M 485 300 Q 462 320 430 328"/>
    <path d="M 468 364 Q 440 358 415 335"/>
    <path d="M 400 385 Q 380 358 375 325"/>
    <path d="M 332 364 Q 343 336 368 320"/>
    <path d="M 315 300 Q 340 286 370 285"/>
    <path d="M 332 236 Q 360 248 375 272"/>
  </g>
  <!-- Hub -->
  <circle cx="400" cy="300" r="38" fill="#94a3b8"/>
  <circle cx="400" cy="300" r="24" fill="#64748b"/>
  <circle cx="400" cy="300" r="10" fill="#334155"/>

  <!-- Discharge pipe (right, tangential exit) -->
  <rect x="634" y="262" width="110" height="76" rx="6" fill="#475569"/>
  <rect x="640" y="268" width="98" height="64" rx="4" fill="#334155"/>
  <!-- Flange -->
  <rect x="736" y="252" width="18" height="96" rx="4" fill="#64748b"/>

  <!-- Suction inlet (top center) -->
  <rect x="362" y="60" width="76" height="96" rx="6" fill="#475569"/>
  <!-- Flange -->
  <rect x="352" y="58" width="96" height="18" rx="4" fill="#64748b"/>

  <!-- Motor right side -->
  <rect x="640" y="160" width="120" height="100" rx="8" fill="#1e293b"/>
  <g fill="#334155">
    <rect x="640" y="170" width="10" height="80" rx="2"/>
    <rect x="656" y="170" width="10" height="80" rx="2"/>
    <rect x="672" y="170" width="10" height="80" rx="2"/>
    <rect x="688" y="170" width="10" height="80" rx="2"/>
  </g>
  <text x="720" y="218" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">11kW</text>

  <!-- Base -->
  <rect x="180" y="480" width="490" height="26" rx="4" fill="#334155"/>

  <!-- Label -->
  <rect x="50" y="30" width="220" height="56" rx="6" fill="#0f4c81" opacity="0.9"/>
  <text x="160" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">FuelPrecision</text>
  <text x="160" y="72" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="bold">FP-Centri-55</text>

  <!-- Spec badge -->
  <rect x="550" y="490" width="200" height="56" rx="6" fill="#f0f4f8" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="514" text-anchor="middle" fill="#0f4c81" font-family="sans-serif" font-size="10">Cột áp / Head</text>
  <text x="650" y="534" text-anchor="middle" fill="#0a3d6b" font-family="sans-serif" font-size="18" font-weight="bold">55 m</text>
</svg>
