<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#dde4ee"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5fa8"/>
      <stop offset="100%" stop-color="#0a3d6b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Pump body (volute casing) -->
  <ellipse cx="400" cy="300" rx="160" ry="150" fill="url(#body)"/>
  <ellipse cx="400" cy="300" rx="148" ry="138" fill="none" stroke="#4a9fd4" stroke-width="2" opacity="0.4"/>

  <!-- Impeller blades -->
  <g transform="translate(400,300)" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.7">
    <line x1="0" y1="-95" x2="0" y2="-55"/>
    <line x1="67" y1="-67" x2="39" y2="-39"/>
    <line x1="95" y1="0" x2="55" y2="0"/>
    <line x1="67" y1="67" x2="39" y2="39"/>
    <line x1="0" y1="95" x2="0" y2="55"/>
    <line x1="-67" y1="67" x2="-39" y2="39"/>
    <line x1="-95" y1="0" x2="-55" y2="0"/>
    <line x1="-67" y1="-67" x2="-39" y2="-39"/>
  </g>
  <!-- Center hub -->
  <circle cx="400" cy="300" r="40" fill="url(#chrome)"/>
  <circle cx="400" cy="300" r="28" fill="#1e3a5f"/>
  <circle cx="400" cy="300" r="12" fill="#94a3b8"/>

  <!-- Inlet pipe (left) -->
  <rect x="170" y="270" width="90" height="60" rx="4" fill="url(#chrome)"/>
  <rect x="168" y="266" width="8" height="68" rx="3" fill="#64748b"/>
  <!-- Inlet flange -->
  <rect x="150" y="258" width="20" height="84" rx="3" fill="#475569"/>

  <!-- Outlet pipe (top) -->
  <rect x="370" y="80" width="60" height="90" rx="4" fill="url(#chrome)"/>
  <rect x="366" y="78" width="68" height="8" rx="3" fill="#64748b"/>
  <!-- Outlet flange -->
  <rect x="358" y="60" width="84" height="20" rx="3" fill="#475569"/>

  <!-- Motor housing (right) -->
  <rect x="560" y="240" width="130" height="120" rx="10" fill="#334155"/>
  <rect x="568" y="248" width="114" height="104" rx="8" fill="#1e293b"/>
  <!-- Motor fins -->
  <g fill="#475569">
    <rect x="560" y="248" width="8" height="104" rx="2"/>
    <rect x="574" y="248" width="8" height="104" rx="2"/>
    <rect x="588" y="248" width="8" height="104" rx="2"/>
    <rect x="602" y="248" width="8" height="104" rx="2"/>
  </g>
  <!-- Shaft coupling -->
  <rect x="556" y="286" width="8" height="28" rx="2" fill="#94a3b8"/>
  <rect x="549" y="282" width="8" height="36" rx="3" fill="#64748b"/>

  <!-- Base plate -->
  <rect x="180" y="430" width="440" height="28" rx="4" fill="#334155"/>
  <rect x="200" y="422" width="24" height="16" rx="2" fill="#475569"/>
  <rect x="576" y="422" width="24" height="16" rx="2" fill="#475569"/>

  <!-- Label -->
  <rect x="50" y="30" width="200" height="56" rx="6" fill="#0f4c81" opacity="0.9"/>
  <text x="150" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">FuelPrecision</text>
  <text x="150" y="72" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="14" font-weight="bold">FP-500X</text>

  <!-- Spec badge -->
  <rect x="550" y="490" width="200" height="56" rx="6" fill="#f0f4f8" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="514" text-anchor="middle" fill="#0f4c81" font-family="sans-serif" font-size="10">Lưu lượng tối đa</text>
  <text x="650" y="534" text-anchor="middle" fill="#0a3d6b" font-family="sans-serif" font-size="18" font-weight="bold">500 L/min</text>
</svg>
