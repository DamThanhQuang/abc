<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#dde4ee"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5fa8"/>
      <stop offset="100%" stop-color="#0a3d6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Hose connection (left) -->
  <rect x="100" y="274" width="80" height="52" rx="8" fill="#64748b"/>
  <ellipse cx="100" cy="300" rx="20" ry="30" fill="#475569"/>
  <ellipse cx="100" cy="300" rx="12" ry="20" fill="#334155"/>

  <!-- Main nozzle body -->
  <path d="M 180 265 L 560 275 L 580 290 L 580 310 L 560 325 L 180 335 Z" fill="url(#nozzle)"/>
  <!-- Body highlight -->
  <path d="M 190 270 L 555 278 L 575 290" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Trigger guard -->
  <path d="M 300 335 Q 310 380 340 400 Q 370 415 390 400 Q 410 385 400 335" fill="url(#handle)" stroke="#0a2d4e" stroke-width="1"/>

  <!-- Trigger -->
  <path d="M 330 335 L 340 370 L 360 370 L 355 335 Z" fill="#1a6bb5"/>

  <!-- Handle body -->
  <path d="M 290 325 Q 290 440 310 460 L 390 460 Q 420 440 420 325 Z" fill="url(#handle)"/>
  <path d="M 305 340 Q 305 440 320 455 L 385 455 Q 410 440 410 340 Z" fill="#0a3d6b" opacity="0.5"/>

  <!-- Automatic shutoff ring -->
  <rect x="500" y="268" width="30" height="64" rx="4" fill="#22d3ee" opacity="0.8"/>
  <text x="515" y="305" text-anchor="middle" fill="#0a3d6b" font-family="sans-serif" font-size="9" font-weight="bold" transform="rotate(-90,515,305)">AUTO</text>

  <!-- Nozzle spout (right taper) -->
  <path d="M 580 284 L 700 295 L 700 305 L 580 316 Z" fill="#334155"/>
  <!-- Spout tip -->
  <ellipse cx="700" cy="300" rx="8" ry="12" fill="#1e293b"/>
  <ellipse cx="700" cy="300" rx="4" ry="7" fill="#0f172a"/>

  <!-- Fuel droplets -->
  <g fill="#3b82f6" opacity="0.6">
    <ellipse cx="720" cy="292" rx="3" ry="5"/>
    <ellipse cx="730" cy="300" rx="2" ry="4"/>
    <ellipse cx="718" cy="310" rx="2" ry="4"/>
  </g>

  <!-- Safety lock indicator -->
  <circle cx="450" cy="285" r="14" fill="#22c55e" opacity="0.85"/>
  <text x="450" y="289" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="bold">OK</text>

  <!-- Label -->
  <rect x="50" y="30" width="200" height="56" rx="6" fill="#0f4c81" opacity="0.9"/>
  <text x="150" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">FuelPrecision</text>
  <text x="150" y="72" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="14" font-weight="bold">NZL-Auto-1</text>

  <!-- Spec badge -->
  <rect x="550" y="490" width="200" height="56" rx="6" fill="#f0f4f8" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="514" text-anchor="middle" fill="#0f4c81" font-family="sans-serif" font-size="10">Lưu lượng tối đa</text>
  <text x="650" y="534" text-anchor="middle" fill="#0a3d6b" font-family="sans-serif" font-size="18" font-weight="bold">80 L/min</text>
</svg>
