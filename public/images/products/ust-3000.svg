<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="soil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tank-outer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tank-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5fa8"/>
      <stop offset="100%" stop-color="#0a3d6b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="270" fill="url(#sky)"/>

  <!-- Ground surface -->
  <rect y="260" width="800" height="12" fill="#4a7c59"/>
  <rect y="272" width="800" height="328" fill="url(#soil)"/>

  <!-- Soil texture dots -->
  <g fill="#92400e" opacity="0.3">
    <circle cx="120" cy="320" r="3"/> <circle cx="200" cy="360" r="2"/> <circle cx="340" cy="340" r="3"/>
    <circle cx="500" cy="380" r="2"/> <circle cx="620" cy="320" r="3"/> <circle cx="700" cy="370" r="2"/>
    <circle cx="160" cy="420" r="2"/> <circle cx="280" cy="450" r="3"/> <circle cx="440" cy="430" r="2"/>
    <circle cx="580" cy="460" r="3"/> <circle cx="680" cy="420" r="2"/>
  </g>

  <!-- Surface access box -->
  <rect x="330" y="220" width="140" height="50" rx="4" fill="#475569"/>
  <rect x="338" y="228" width="124" height="34" rx="3" fill="#334155"/>
  <text x="400" y="250" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">MANHOLE</text>
  <!-- Riser pipes -->
  <rect x="358" y="185" width="16" height="80" fill="#64748b"/>
  <rect x="426" y="185" width="16" height="80" fill="#64748b"/>

  <!-- Outer tank wall -->
  <ellipse cx="400" cy="410" rx="240" ry="110" fill="url(#tank-outer)"/>
  <rect x="160" y="410" width="480" height="90" fill="url(#tank-outer)"/>
  <ellipse cx="400" cy="500" rx="240" ry="110" fill="#2d3f52"/>

  <!-- Inner tank wall (double-wall gap visible) -->
  <ellipse cx="400" cy="415" rx="214" ry="88" fill="#334155"/>
  <rect x="186" y="415" width="428" height="74" fill="#334155"/>
  <ellipse cx="400" cy="489" rx="214" ry="88" fill="#253447"/>

  <!-- Tank inner (fuel) -->
  <ellipse cx="400" cy="420" rx="194" ry="72" fill="url(#tank-inner)"/>
  <rect x="206" y="420" width="388" height="58" fill="url(#tank-inner)"/>
  <ellipse cx="400" cy="478" rx="194" ry="72" fill="#0a2840"/>

  <!-- Fuel level -->
  <ellipse cx="400" cy="448" rx="185" ry="24" fill="#1a6bb5" opacity="0.5"/>
  <text x="400" y="455" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="18" font-weight="bold" opacity="0.8">30,000 L</text>

  <!-- Double-wall indicator labels -->
  <line x1="160" y1="415" x2="80" y2="380" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="70" y="375" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="10">Outer wall</text>
  <line x1="186" y1="415" x2="106" y2="355" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="96" y="350" text-anchor="middle" fill="#22d3ee" font-family="sans-serif" font-size="10">Inner wall</text>

  <!-- Leak detector sensor -->
  <circle cx="400" cy="435" r="8" fill="#22c55e" opacity="0.9"/>
  <line x1="400" y1="427" x2="400" y2="350" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="408" y="347" fill="#22c55e" font-family="sans-serif" font-size="10">Leak sensor OK</text>

  <!-- Label -->
  <rect x="50" y="30" width="200" height="56" rx="6" fill="#0f4c81" opacity="0.9"/>
  <text x="150" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">FuelPrecision</text>
  <text x="150" y="72" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="14" font-weight="bold">UST-3000</text>

  <!-- Spec badge -->
  <rect x="550" y="30" width="210" height="56" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="655" y="52" text-anchor="middle" fill="#0f4c81" font-family="sans-serif" font-size="10">Dung tích</text>
  <text x="655" y="72" text-anchor="middle" fill="#0a3d6b" font-family="sans-serif" font-size="18" font-weight="bold">30.000 L</text>
</svg>
