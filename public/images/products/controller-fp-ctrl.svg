<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#dde4ee"/>
    </linearGradient>
    <linearGradient id="device" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Device outer housing -->
  <rect x="180" y="120" width="440" height="360" rx="18" fill="url(#device)"/>
  <rect x="192" y="132" width="416" height="336" rx="12" fill="#0f172a"/>

  <!-- Screen -->
  <rect x="210" y="150" width="380" height="240" rx="8" fill="#020617"/>
  <rect x="218" y="158" width="364" height="224" rx="6" fill="#030d1a"/>

  <!-- Screen content - Dashboard UI -->
  <!-- Header bar -->
  <rect x="218" y="158" width="364" height="32" rx="6" fill="#0f4c81"/>
  <text x="236" y="179" fill="white" font-family="sans-serif" font-size="12" font-weight="bold">FuelControl Pro</text>
  <circle cx="566" cy="174" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Bar chart -->
  <g fill="#1e5fa8" opacity="0.7">
    <rect x="236" y="230" width="22" height="80" rx="2"/>
    <rect x="268" y="210" width="22" height="100" rx="2"/>
    <rect x="300" y="195" width="22" height="115" rx="2"/>
    <rect x="332" y="220" width="22" height="90" rx="2"/>
    <rect x="364" y="205" width="22" height="105" rx="2"/>
  </g>
  <g fill="#3b82f6" opacity="0.9">
    <rect x="238" y="258" width="18" height="52"/>
    <rect x="270" y="245" width="18" height="65"/>
    <rect x="302" y="230" width="18" height="80"/>
    <rect x="334" y="252" width="18" height="58"/>
    <rect x="366" y="240" width="18" height="70"/>
  </g>
  <!-- Chart labels -->
  <g fill="#4a9fd4" font-family="monospace" font-size="9">
    <text x="243" y="320">T1</text>
    <text x="275" y="320">T2</text>
    <text x="307" y="320">T3</text>
    <text x="339" y="320">T4</text>
    <text x="371" y="320">T5</text>
  </g>

  <!-- Right panel - stats -->
  <rect x="406" y="198" width="160" height="130" rx="6" fill="#051122" stroke="#1e5fa8" stroke-width="1"/>
  <text x="486" y="216" text-anchor="middle" fill="#4a9fd4" font-family="sans-serif" font-size="9" opacity="0.8">TOTAL FLOW</text>
  <text x="486" y="238" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="20" font-weight="bold">1,247</text>
  <text x="486" y="252" text-anchor="middle" fill="#4a9fd4" font-family="monospace" font-size="10">L / hour</text>
  <line x1="418" y1="264" x2="554" y2="264" stroke="#1e3a5f" stroke-width="1"/>
  <text x="486" y="280" text-anchor="middle" fill="#4a9fd4" font-family="sans-serif" font-size="9" opacity="0.8">PRESSURE</text>
  <text x="486" y="300" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="18" font-weight="bold">6.2 bar</text>
  <text x="486" y="318" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="9">NORMAL</text>

  <!-- IoT signal indicator -->
  <g fill="#22d3ee" opacity="0.6" transform="translate(234,335)">
    <rect x="0" y="18" width="6" height="8" rx="1"/>
    <rect x="10" y="12" width="6" height="14" rx="1"/>
    <rect x="20" y="6" width="6" height="20" rx="1"/>
    <rect x="30" y="0" width="6" height="26" rx="1"/>
  </g>
  <text x="282" y="352" fill="#22d3ee" font-family="sans-serif" font-size="9">4G Connected</text>

  <!-- Bottom buttons on device -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1">
    <rect x="218" y="398" width="64" height="22" rx="4"/>
    <rect x="294" y="398" width="64" height="22" rx="4"/>
    <rect x="370" y="398" width="64" height="22" rx="4"/>
    <rect x="446" y="398" width="64" height="22" rx="4"/>
    <rect x="522" y="398" width="64" height="22" rx="4"/>
  </g>
  <g fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">
    <text x="250" y="413">HOME</text>
    <text x="326" y="413">DATA</text>
    <text x="402" y="413">CONFIG</text>
    <text x="478" y="413">ALERTS</text>
    <text x="554" y="413">HELP</text>
  </g>

  <!-- Port indicators -->
  <g fill="#334155">
    <rect x="200" y="440" width="12" height="24" rx="3"/>
    <rect x="220" y="440" width="12" height="24" rx="3"/>
    <rect x="544" y="440" width="12" height="24" rx="3"/>
    <rect x="564" y="440" width="12" height="24" rx="3"/>
  </g>

  <!-- Label -->
  <rect x="50" y="30" width="220" height="56" rx="6" fill="#0f4c81" opacity="0.9"/>
  <text x="160" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">FuelPrecision</text>
  <text x="160" y="72" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="bold">FP-CTRL-Pro</text>

  <!-- IoT badge -->
  <rect x="530" y="490" width="220" height="56" rx="6" fill="#f0f4f8" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="514" text-anchor="middle" fill="#0f4c81" font-family="sans-serif" font-size="10">Kết nối</text>
  <text x="640" y="534" text-anchor="middle" fill="#0a3d6b" font-family="sans-serif" font-size="15" font-weight="bold">4G / Wi-Fi / ETH</text>
</svg>
