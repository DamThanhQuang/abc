  <!-- Trend arrow -->
  <path d="M 450 360 L 490 320 L 530 330 L 570 280 L 610 260 L 650 200" stroke="white" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="650,185 640,208 665,202" fill="white" opacity="0.4"/>
