  <rect x="50" y="50" width="190" height="32" rx="16" fill="white" opacity="0.2"/>
  <text x="145" y="71" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">KIẾN THỨC NGÀNH</text>
