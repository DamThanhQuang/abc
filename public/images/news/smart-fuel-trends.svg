    <line x1="560" y1="160" x2="640" y2="240"/>
    <line x1="640" y1="240" x2="580" y2="310"/>
    <line x1="560" y1="160" x2="500" y2="200"/>
    <line x1="560" y1="160" x2="620" y2="170"/>
    <line x1="620" y1="170" x2="640" y2="240"/>
