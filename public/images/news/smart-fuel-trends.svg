  <text x="80" y="185" fill="white" font-family="sans-serif" font-size="32" font-weight="bold" opacity="0.95">Xu hướng 2025:</text>
  <text x="80" y="228" fill="white" font-family="sans-serif" font-size="28" font-weight="bold" opacity="0.85">IoT &amp; Smart Fuel</text>
  <text x="80" y="275" fill="white" font-family="sans-serif" font-size="16" opacity="0.7">Tự động hóa · Giám sát thời gian thực</text>
  <text x="80" y="400" fill="white" font-family="sans-serif" font-size="13" opacity="0.5" font-weight="bold" letter-spacing="2">FUELPRECISION INDUSTRIAL</text>
