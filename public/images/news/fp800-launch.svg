<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.1">
    <circle cx="700" cy="80" r="200" fill="white"/>
    <circle cx="100" cy="380" r="150" fill="white"/>
  </g>
  <!-- Product silhouette -->
  <ellipse cx="500" cy="225" rx="130" ry="120" fill="white" opacity="0.12"/>
  <ellipse cx="500" cy="225" rx="100" ry="92" fill="white" opacity="0.08"/>
  <circle cx="500" cy="225" r="32" fill="white" opacity="0.2"/>
  <g stroke="white" stroke-width="3" opacity="0.25" fill="none">
    <line x1="500" y1="115" x2="500" y2="133"/>
    <line x1="500" y1="317" x2="500" y2="335"/>
    <line x1="390" y1="225" x2="408" y2="225"/>
    <line x1="592" y1="225" x2="610" y2="225"/>
  </g>
  <!-- Tag -->
  <rect x="50" y="50" width="180" height="32" rx="16" fill="white" opacity="0.25"/>
  <text x="140" y="71" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">SẢN PHẨM MỚI</text>
  <!-- Main text -->
  <text x="80" y="190" fill="white" font-family="sans-serif" font-size="42" font-weight="bold" opacity="0.95">FP-800</text>
  <text x="80" y="240" fill="white" font-family="sans-serif" font-size="24" opacity="0.85">Ultra Series</text>
  <text x="80" y="290" fill="white" font-family="sans-serif" font-size="16" opacity="0.7">800 L/min · High Performance</text>
  <!-- FuelPrecision brand -->
  <text x="80" y="400" fill="white" font-family="sans-serif" font-size="13" opacity="0.6" font-weight="bold" letter-spacing="2">FUELPRECISION INDUSTRIAL</text>
