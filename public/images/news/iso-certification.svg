<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.08">
    <circle cx="650" cy="100" r="220" fill="white"/>
    <circle cx="150" cy="400" r="180" fill="white"/>
  </g>
  <!-- Certificate badge -->
  <circle cx="520" cy="225" r="120" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  <circle cx="520" cy="225" r="100" fill="white" opacity="0.1"/>
  <circle cx="520" cy="225" r="80" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
  <!-- Star/seal decoration -->
  <g fill="white" opacity="0.3">
    <polygon points="520,120 532,158 572,158 540,182 552,220 520,196 488,220 500,182 468,158 508,158"/>
  </g>
  <text x="520" y="218" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold" opacity="0.9">ISO</text>
  <text x="520" y="240" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" opacity="0.7">9001:2015</text>
  <!-- Checkmark -->
  <path d="M 500 260 L 514 278 L 544 248" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Tag -->
  <rect x="50" y="50" width="160" height="32" rx="16" fill="white" opacity="0.2"/>
  <text x="130" y="71" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">TIN CÔNG TY</text>
  <!-- Main text -->
  <text x="80" y="190" fill="white" font-family="sans-serif" font-size="34" font-weight="bold" opacity="0.95">Chứng nhận</text>
  <text x="80" y="234" fill="white" font-family="sans-serif" font-size="34" font-weight="bold" opacity="0.95">ISO 9001</text>
  <text x="80" y="278" fill="white" font-family="sans-serif" font-size="16" opacity="0.7">Kỳ tái chứng nhận 2024</text>
  <text x="80" y="400" fill="white" font-family="sans-serif" font-size="13" opacity="0.5" font-weight="bold" letter-spacing="2">FUELPRECISION INDUSTRIAL</text>
</svg>
