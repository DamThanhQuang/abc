services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fuelprecision
      POSTGRES_PASSWORD: fuelprecision
      POSTGRES_DB: fuelprecision
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
